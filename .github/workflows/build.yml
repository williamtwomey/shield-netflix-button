name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" "platforms;android-35" > /dev/null

      - name: Set version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v=${GITHUB_REF_NAME#v}
            echo "$v" | grep -Eq '^[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$' || { echo "tag must be vX.Y.Z"; exit 1; }
            IFS=. read -r major minor patch <<< "$v"
            echo "VERSION_CODE=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"
            echo "VERSION_NAME=$v" >> "$GITHUB_ENV"
          else
            echo "VERSION_CODE=1" >> "$GITHUB_ENV"
            echo "VERSION_NAME=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Load release key
        if: github.ref_type == 'tag'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "SIGNING_KEYSTORE_B64 not set"; exit 1; }
          umask 077
          echo "$KEYSTORE_B64" | base64 -d > stub.jks
          printf '%s' "$KEYSTORE_PASSWORD" > stub.jks.pass

      - name: Build
        run: |
          ./build.sh
          mv out/netflix-stub.apk "out/netflix-stub-$VERSION_NAME.apk"
          rm -f stub.jks stub.jks.pass

      - uses: actions/upload-artifact@v7
        with:
          name: netflix-stub-${{ env.VERSION_NAME }}
          path: out/netflix-stub-${{ env.VERSION_NAME }}.apk

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="out/netflix-stub-$VERSION_NAME.apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "SHA-256: \`$(sha256sum "$apk" | cut -d' ' -f1)\`"
